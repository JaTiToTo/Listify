openapi: 3.0.3
info:
  title: Listify Backend API
  description:
    This is the backend API for Listify, a music discovery and playlist creation
    application that integrates with Spotify. It provides endpoints for user
    authentication, song recommendations based on audio features, track previews,
    and playlist creation.
  version: 1.0.0

servers:
  - url: http://localhost:8081

tags:
  - name: Auth
    description: Spotify authentication endpoints
  - name: Music
    description: Music discovery and preview endpoints
  - name: Playlists
    description: Playlist creation endpoints

paths:
  /api/auth/login/spotify:
    get:
      summary: Initiate Spotify login
      operationId: initiateSpotifyLogin
      description: >
        Generates a PKCE code verifier and challenge, stores the code verifier
        in the session, and returns the Spotify authorization URL for the
        frontend to redirect to.
      tags:
        - Auth
      responses:
        "200":
          description: Spotify authorization URL as plain text
          content:
            text/plain:
              schema:
                type: string
                example: >
                  https://accounts.spotify.com/authorize?response_type=code
                  &client_id=abc123
                  &redirect_uri=http://localhost:8080/auth/callback
                  &scope=playlist-modify-public%20playlist-modify-private
                  &code_challenge_method=S256
                  &code_challenge=xyz789
                  &state=randomStateString
        "500":
          description: Failed to generate PKCE parameters or build Spotify URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      summary: Log out the current user
      operationId: logout
      tags:
        - Auth
      responses:
        "200":
          description: Successfully logged out

  /api/auth/callback:
    get:
      summary: Handle Spotify OAuth callback
      operationId: spotifyCallback
      description: >
        Receives the authorization code or error returned by Spotify after the
        user authorizes the app, exchanges the code for tokens, and redirects
        the browser to the frontend callback route.
      tags:
        - Auth
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code returned by Spotify.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: State parameter used to prevent CSRF.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Error returned by Spotify when authorization fails.
      responses:
        "302":
          description: Redirects to the frontend callback URL after the OAuth flow completes.
        "500":
          description: Failed to exchange the authorization code for an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/songs/recommendations:
    get:
      tags:
        - Music
      summary: Get songs that match the create-page audio filter parameters
      operationId: getRecommendedSongs
      description: >
        Returns a list of songs that match the playlist creation filters supplied
        by the frontend create page.
      parameters:
        # Popularity? Removed temporarily because it is not a Spotify audio feature and is not supported by the Spotify API for recommendations; unknown where from
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of songs to return.
        - name: acousticness
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
          description: Acoustic or electronic balance, where 0 is electronic and 1 is acoustic.
        - name: danceability
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
          description: How suitable the track is for dancing, from 0 to 1.
        - name: energy
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
          description: Intensity and activity level of the track, from 0 to 1.
        - name: instrumentalness
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
          description: Likelihood that the track contains no vocals, from 0 to 1.
        - name: loudness
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: -60
            maximum: 0
          description: Track loudness in decibels, usually between -60 and 0.
        - name: tempo
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 60
            maximum: 200
          description: Tempo in beats per minute.
        - name: valence
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
          description: Musical positivity or mood, from 0 to 1.
      responses:
        "200":
          description: List of matching songs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongSearchResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to retrieve recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/playlists:
    post:
      tags:
        - Playlists
      summary: Create a playlist from song IDs
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistRequest"
      responses:
        "201":
          description: Playlist created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistResponse"
        "400":
          description: Invalid playlist payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to create playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-06-11T14:32:00Z"
        status:
          type: integer
          example: 500
        error:
          type: string
          example: Internal Server Error
        message:
          type: string
          example: Failed to generate PKCE parameters
      required:
        - timestamp
        - status
        - error
        - message

    ExternalUrlsItem:
      type: object
      properties:
        spotify:
          type: string
          format: uri
          example: https://open.spotify.com/artist/3gBZUcNeVumkeeJ19CY2sX
      required:
        - spotify

    ImageItem:
      type: object
      properties:
        height:
          type: integer
          example: 640
        width:
          type: integer
          example: 640
        url:
          type: string
          format: uri
          example: https://i.scdn.co/image/ab67616d0000b273e34f259b461e589917140e65
      required:
        - height
        - width
        - url

    ArtistItem:
      type: object
      properties:
        external_urls:
          $ref: '#/components/schemas/ExternalUrlsItem'
        href:
          type: string
          format: uri
          example: https://api.spotify.com/v1/artists/3gBZUcNeVumkeeJ19CY2sX
        id:
          type: string
          example: 3gBZUcNeVumkeeJ19CY2sX
        name:
          type: string
          example: Ken Carson
        type:
          type: string
          example: artist
        uri:
          type: string
          example: spotify:artist:3gBZUcNeVumkeeJ19CY2sX
      required:
        - external_urls
        - href
        - id
        - name
        - type
        - uri

    ExternalIdsItem:
      type: object
      properties:
        isrc:
          type: string
          example: TCAFB2005896
      required:
        - isrc

    AlbumItem:
      type: object
      properties:
        album_type:
          type: string
          example: single
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistItem'
        external_urls:
          $ref: '#/components/schemas/ExternalUrlsItem'
        href:
          type: string
          format: uri
          example: https://api.spotify.com/v1/albums/0NMHUXzCJRMrrwS5UDI8rM
        id:
          type: string
          example: 0NMHUXzCJRMrrwS5UDI8rM
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageItem'
        is_playable:
          type: boolean
          example: true
        name:
          type: string
          example: Teen X
        release_date:
          type: string
          example: '2020-08-14'
        release_date_precision:
          type: string
          example: day
        total_tracks:
          type: integer
          example: 6
        type:
          type: string
          example: album
        uri:
          type: string
          example: spotify:album:0NMHUXzCJRMrrwS5UDI8rM
      required:
        - album_type
        - artists
        - external_urls
        - href
        - id
        - images
        - is_playable
        - name
        - release_date
        - release_date_precision
        - total_tracks
        - type
        - uri

    SongItem:
      type: object
      properties:
        album:
          $ref: '#/components/schemas/AlbumItem'
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistItem'
        disc_number:
          type: integer
          example: 1
        duration_ms:
          type: integer
          example: 106533
        explicit:
          type: boolean
          example: true
        external_ids:
          $ref: '#/components/schemas/ExternalIdsItem'
        external_urls:
          $ref: '#/components/schemas/ExternalUrlsItem'
        href:
          type: string
          format: uri
          example: https://api.spotify.com/v1/tracks/66yPalPs9DrhbGb9gR3vD9
        id:
          type: string
          example: 66yPalPs9DrhbGb9gR3vD9
        is_local:
          type: boolean
          example: false
        is_playable:
          type: boolean
          example: true
        name:
          type: string
          example: Yale
        track_number:
          type: integer
          example: 2
        type:
          type: string
          example: track
        uri:
          type: string
          example: spotify:track:66yPalPs9DrhbGb9gR3vD9
      required:
        - album
        - artists
        - disc_number
        - duration_ms
        - explicit
        - external_ids
        - external_urls
        - href
        - id
        - is_local
        - is_playable
        - name
        - track_number
        - type
        - uri

    SongSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SongItem"
      required:
        - items

    CreatePlaylistRequest:
      type: object
      properties:
        songIds:
          type: array
          items:
            type: string
          example:
            - 4aKdmOXdUKfITthWswfQ
            - 7xGfFoTpQ2qVdQ3K4mQ5c
      required:
        - songIds

    PlaylistResponse:
      type: object
      properties:
        playlistId:
          type: string
          example: pl_123456789
      required:
        - playlistId
